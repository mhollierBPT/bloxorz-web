<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bloxorz — the classic block-rolling puzzle. Self-hosted HTML5 build.">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>Bloxorz</title>
<style>
  #animation_container, #_preload_div_ {
	position:absolute;
	margin:auto;
	left:0;right:0;
	top:0;bottom:0;
  }
  .no-select {
    -webkit-touch-callout: none; /* iOS Safari */
    -webkit-user-select: none; /* Safari */
    -khtml-user-select: none; /* Konqueror HTML */
    -moz-user-select: none; /* Old versions of Firefox */
    -ms-user-select: none; /* IE */
    user-select: none;
    }
</style>
<script src="lib/jquery-3.6.3.min.js"></script>
<script src="lib/createjs-2015.11.26.min.js"></script>
<script src="bloxorz.js"></script>
<script>
  // The game calls these on level transitions to coordinate with an
  // host-pause pause in a host page. Here they are inert: the game's own
  // 1s fallback advances the level.
  let isHostPauseActive = false;
  let wasMuted = false;
  let onHostPauseCompleteCallback = null;
  function hostPauseCall() {}
</script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
	canvas = document.getElementById("canvas");
	anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	var comp=AdobeAn.getComposition("FE31B685947E79408F0C8768D6EC8517");
	var lib=comp.getLibrary();
	var loader = new createjs.LoadQueue(false);
	loader.installPlugin(createjs.Sound);
	loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
	loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
	var lib=comp.getLibrary();
	loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
	var images=comp.getImages();
	if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }
}
function handleComplete(evt,comp) {
	//This function is always called, irrespective of the content. You can use the variable "stage" after it is created in token create_stage.
	var lib=comp.getLibrary();
	var ss=comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	for(i=0; i<ssMetadata.length; i++) {
		ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
	}
	var preloaderDiv = document.getElementById("_preload_div_");
	preloaderDiv.style.display = 'none';
	dom_overlay_container.style.display = canvas.style.display = 'block';
	exportRoot = new lib.bloxorzhtml();
	stage = new lib.Stage(canvas);
	stage.enableMouseOver();
	// Muted by default (embedded widget); the pause-menu sound toggle
	// unmutes and the choice is remembered.
	try {
		createjs.Sound.volume = window.localStorage.getItem("bloxorz_muted") === "0" ? 1 : 0;
	} catch (e) {
		createjs.Sound.volume = 0;
	}
	//Registers the "tick" event listener.
	fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.setFPS(lib.properties.fps);
		// Drive the 36fps clock from requestAnimationFrame instead of the
		// default nested setTimeout: Chrome clamps timers to 1s in a
		// visible-but-unfocused tab (e.g. an embedded dashboard widget),
		// which stalled every tick-based transition; rAF keeps running.
		createjs.Ticker.timingMode = createjs.Ticker.RAF_SYNCHED;
		createjs.Ticker.addEventListener("tick", function(event) {
			if (isHostPauseActive) return;
			stage.update(event);
		});
	}
	//Code to support hidpi screens and responsive scaling.
	function makeResponsive(isResp, respDim, isScale, scaleType) {
		var lastW, lastH, lastS=1;
		window.addEventListener('resize', resizeCanvas);
		resizeCanvas();
		function resizeCanvas() {
			var w = lib.properties.width, h = lib.properties.height;
			var iw = window.innerWidth, ih=window.innerHeight;
			// Cap the pixel-ratio at 1.5: the game renders at 36fps, so the
			// extra backing-store pixels on 2x/3x displays are pure fill-rate
			// cost with little visible benefit.
			var pRatio = Math.min(window.devicePixelRatio || 1, 1.5), xRatio=iw/w, yRatio=ih/h, sRatio=1;
			if(isResp) {
				if((respDim=='width'&&lastW==iw) || (respDim=='height'&&lastH==ih)) {
					sRatio = lastS;
				}
				else if(!isScale) {
					if(iw<w || ih<h)
						sRatio = Math.min(xRatio, yRatio);
				}
				else if(scaleType==1) {
					sRatio = Math.min(xRatio, yRatio);
				}
				else if(scaleType==2) {
					sRatio = Math.max(xRatio, yRatio);
				}
			}
			canvas.width = w*pRatio*sRatio;
			canvas.height = h*pRatio*sRatio;
			canvas.style.width = anim_container.style.width = dom_overlay_container.style.width = preloaderDiv.style.width = w*sRatio+'px';
			canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = preloaderDiv.style.height = h*sRatio+'px';
			stage.scaleX = pRatio*sRatio;
			stage.scaleY = pRatio*sRatio;
			lastW = iw; lastH = ih; lastS = sRatio;
			stage.tickOnUpdate = false;
			stage.update();
			stage.tickOnUpdate = true;
		}
	}
	makeResponsive(true,'both',true,1);
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
}
function playSound(id, loop) {
	return createjs.Sound.play(id, createjs.Sound.INTERRUPT_EARLY, 0, 0, loop);
}
</script>
<script type="text/javascript">
  setTimeout(function(){
    if(document.getElementsByTagName("canvas").length) {
      document.getElementsByTagName("body")[0].classList.add("no-select")
    }
  }, 2000);
</script>
</head>
<body onload="init();" style="margin:0px; background-color:#000;">
	<div id="animation_container" style="background-color:rgba(0, 0, 0, 1.00); width:550px; height:300px">
		<canvas id="canvas" width="550" height="300" style="position: absolute; display: none; background-color:rgba(0, 0, 0, 1.00);"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:550px; height:300px; position: absolute; left: 0px; top: 0px; display: none;">
		</div>
	</div>
    <div id='_preload_div_' style='position:absolute; top:0; left:0; display: inline-block; height:300px; width: 550px; text-align: center;'>
		<span style='display: inline-block; height: 100%; vertical-align: middle;'></span>
		<img src="images/_preloader.gif" style='vertical-align: middle; max-height: 100%'/>
	</div>
</body>
</html>
